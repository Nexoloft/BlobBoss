<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntiOsteo Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="settings-app">
    <h2>Settings</h2>

    <div class="section-label">Timer</div>
    <div class="field">
      <label for="interval">Reminder interval (minutes)</label>
      <input type="number" id="interval" min="1" max="120" value="30">
    </div>

    <div class="section-label">Exercises</div>
    <div class="field">
      <label for="exercises">Exercise description</label>
      <input type="text" id="exercises" value="30 pushups + 30 squats">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="default-pushups">Default pushups</label>
        <input type="number" id="default-pushups" min="0" max="999" value="30">
      </div>
      <div class="field">
        <label for="default-squats">Default squats</label>
        <input type="number" id="default-squats" min="0" max="999" value="30">
      </div>
    </div>

    <div class="section-label">Widget</div>
    <div class="field checkbox-field">
      <input type="checkbox" id="show-widget" checked>
      <label for="show-widget">Show floating widget</label>
    </div>
    <div class="field">
      <label for="widget-position">Widget position</label>
      <select id="widget-position">
        <option value="top-left">Top Left</option>
        <option value="top-right">Top Right</option>
        <option value="bottom-left">Bottom Left</option>
        <option value="bottom-right" selected>Bottom Right</option>
      </select>
    </div>
    <div class="field">
      <label for="widget-opacity">Widget opacity</label>
      <input type="range" id="widget-opacity" min="0.3" max="1" step="0.1" value="0.9">
    </div>

    <div class="section-label">System</div>
    <div class="field checkbox-field">
      <input type="checkbox" id="autostart">
      <label for="autostart">Start with Windows</label>
    </div>

    <button class="btn btn-primary" id="btn-save">Save</button>
  </div>
  <script type="module" src="settings.js"></script>
</body>
</html>
